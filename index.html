
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>

    <div id="root"></div>

    <script type="text/babel">

        function App() {
            const [name, setName] = React.useState("");
            const [roll, setRoll] = React.useState("");
            const [email, setEmail] = React.useState("");
            const [gender, setGender] = React.useState("");
            const [course, setCourse] = React.useState("");

            function handleSubmit(e) {
                e.preventDefault();
                alert("Registration Successful!");

                console.log(name, roll, email, gender, course);
            }

            return (
                <div>
                    <h2>Student Registration Form</h2>

                    <form onSubmit={handleSubmit}>

                        Name:<br/>
                        <input type="text" value={name}
                        onChange={(e) => setName(e.target.value)} required/>
                        <br/><br/>

                        Roll Number:<br/>
                        <input type="text" value={roll}
                        onChange={(e) => setRoll(e.target.value)} required/>
                        <br/><br/>

                        Email:<br/>
                        <input type="email" value={email}
                        onChange={(e) => setEmail(e.target.value)} required/>
                        <br/><br/>

                        Gender:<br/>
                        <input type="radio" name="gender" value="Male"
                        onChange={(e) => setGender(e.target.value)} required/> Male

                        <input type="radio" name="gender" value="Female"
                        onChange={(e) => setGender(e.target.value)}/> Female
                        <br/><br/>

                        Course:<br/>
                        <select value={course}
                        onChange={(e) => setCourse(e.target.value)} required>
                            <option value="">Select Course</option>
                            <option value="CSE">CSE</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="IT">IT</option>
                        </select>

                        <br/><br/>

                        <button type="submit">Register</button>

                    </form>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root"))
        .render(<App />);

    </script>

</body>
</html>
